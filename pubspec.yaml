name: tivimate_clone
description: A modern IPTV player app for mobile and TV platforms

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  video_player: ^2.9.1
  chewie: ^1.8.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.1.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  xml: ^6.5.0
  intl: ^0.19.0
  url_launcher: ^6.2.3
  package_info_plus: ^5.0.1
  wakelock_plus: ^1.1.4
  screen_brightness: ^0.2.0+1
  volume_controller: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
